# Render Blueprint за FastAPI backend-от
# Render -> New -> Blueprint -> изберете го ова репо
services:
  - type: web
    name: enigma-escape-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DATABASE_URL
        sync: false # се внесува рачно во Render (Neon connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:3000 # *.vercel.app е веќе дозволено во кодот
