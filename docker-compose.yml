# RepoRun: само дозволени полиња (без ports, env_file, labels, restart, networks).
# Базата е Neon (надворешна), па нема postgres сервис ни .stack-data/ volumes.
services:
  # Next.js frontend – единствениот јавен сервис (види stack.yml)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8001
    depends_on:
      api:
        condition: service_healthy  # web чека додека api не одговори на /api/health
    cpus: 0.25
    mem_limit: 512m

  # FastAPI backend – достапен само внатре како http://api:8001
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Neon адресата под посебно име, за RepoRun да не ја пребрише
      NEON_DATABASE_URL: ${NEON_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    # Python наместо curl (curl го нема во python:3.12-slim)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpus: 0.25
    mem_limit: 256m
