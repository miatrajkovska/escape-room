# Кој сервис RepoRun го изложува на интернет
version: 1
ingress:
  - name: app
    service: web      # compose сервисот (Next.js)
    port: 3000        # портата на која слуша
    primary: true
    access:
      type: public    # секој може да го отвори сајтот

  # ПРИВРЕМЕНО за дебагирање: backend-от директно (на пр. /api/health). Да се тргне потоа!
  - name: api
    service: api
    port: 8001
    primary: false
    access:
      type: public
